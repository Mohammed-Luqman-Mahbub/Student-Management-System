<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        let currentStudentId = null;
        function loadStudentToForm() {
            const urlParams = new URLSearchParams(window.location.search);
            currentStudentId = parseInt(urlParams.get('id'));
            if (!currentStudentId) {
                alert("No student selected!");
                window.location.href = "viewstudent.html";
                return;
            }
            const students = JSON.parse(localStorage.getItem('students')) || [];
            const student = students.find(s => s.id === currentStudentId);
            if (student) {
                document.getElementById("sid").value = student.id;
                document.getElementById("name").value = student.name;
                document.getElementById("branch").value = student.branch;
                document.getElementById("cgpa").value = student.cgpa;
            } else {
                alert("Student not found!");
                window.location.href = "viewstudent.html";
            }
        }   
        function updateStudent(event) {
            event.preventDefault(); 
            let students = JSON.parse(localStorage.getItem('students')) || [];
            let studentIndex = students.findIndex(s => s.id === currentStudentId);
            if (studentIndex !== -1) {
                students[studentIndex].name = document.getElementById("name").value.trim();
                students[studentIndex].branch = document.getElementById("branch").value.trim();
                students[studentIndex].cgpa = parseFloat(document.getElementById("cgpa").value);
                localStorage.setItem('students', JSON.stringify(students));
                alert("Student details updated successfully!");
                window.location.href = "viewstudent.html"; 
            } else {
                alert("Error updating student details.");
            }
        }
        document.addEventListener("DOMContentLoaded", loadStudentToForm);
    </script>
</head>
<body class="text-center">
    <div class="container mt-5" style="max-width: 500px;">
        <h1 class="mb-4">Edit Student Details</h1>
        <form onsubmit="updateStudent(event)">
            <div class="mb-3 text-start">
                <label class="form-label">Student ID:</label>
                <input type="number" id="sid" class="form-control" disabled>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Student Name:</label>
                <input type="text" id="name" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">Branch:</label>
                <input type="text" id="branch" class="form-control" required>
            </div>
            <div class="mb-3 text-start">
                <label class="form-label">CGPA :</label>
                <input type="number" id="cgpa" step="0.1" class="form-control" required>
            </div>
            
            <div class="d-flex gap-2 justify-content-center mt-4">
                <button type="submit" class="btn btn-outline-success">Submit</button>
                <a href="viewstudent.html" class="btn btn-outline-danger">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
