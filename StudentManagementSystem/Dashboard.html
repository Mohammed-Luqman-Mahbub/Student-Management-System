<body class="text-center">
    <h1>Dashboard</h1>
    <div class="col-12" style="display: flex;  align-items: center; justify-content: center;">
     <div class="card border-3" style="width: 210px; height: 80px; background-color: aliceblue;">
        <!-- <img src="" class="card-img-overlay"> -->
        <div style="color: #0051ff; " class="card-body">
            Total Students : 100 
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person" viewBox="0 0 16 16">
            <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
            </svg>
        </div>
     </div>   
     <div class="card border-3" style="background-color: rgb(248, 255, 221);  width: 210px; height: 80px;">
        <!-- <img src="" class="card-img-overlay"> -->
        <div style="color: #b1c405; " class="card-body">
            Placed Students: 10 
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-check-fill" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 0 1 .708-.708L12.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0"/>

            </svg>
        </div>
     </div>
    </div>
    <div class="col-12" style="display: flex; align-items: center; justify-content: center; ">
     <div class="card border-3" style="background-color: rgb(234, 255, 220); width: 210px; height: 80px;">
        <!-- <img src="" class="card-img-overlay"> -->
        <div style="color: #00ff00; " class="card-body">
            Present Students  : 90
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-fill-check" viewBox="0 0 16 16">
            <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7m1.679-4.493-1.335 2.226a.75.75 0 0 1-1.174.144l-.774-.773a.5.5 0 0 1 .708-.708l.547.548 1.17-1.951a.5.5 0 1 1 .858.514M11 5a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>

        </svg>
        </div>
     </div>   
     <div class="card border-3" style="width: 210px; height: 80px; background-color: rgb(255, 240, 240); ">
        <!-- <img src="" class="card-img-overlay"> -->
        <div style="color: #ff0000; height: 80px;" class="card-body">
            Absent Students: 10  
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-dash" viewBox="0 0 16 16">
            <path d="M12.5 16a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7M11 12h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1 0-1m0-7a3 3 0 1 1-6 0 3 3 0 0 1 6 0M8 7a2 2 0 1 0 0-4 2 2 0 0 0 0 4"/>

            </svg>  
        </div>
     </div>
    </div>
    <div class="m-5"><br></div>
    <h2><a href="viewstudent.html" style="text-decoration: none;"> View student </a></h2>

                <div class="modal-content">

                        <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>

                    <div class="modal-body">
                        Are you sure you want to log out?
                    </div>

                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            Cancel
                        </button>
                        <a href="logout.html" class="btn btn-danger">
                            Logout
                        </a>
                    </div>
                </div>
            </div>
