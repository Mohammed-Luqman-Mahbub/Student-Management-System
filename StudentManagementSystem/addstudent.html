        <script>
           async function add(event) {
                event.preventDefault();
                let sid = document.getElementById("sid").value;
                let name = document.getElementById("name").value;
                let branch = document.getElementById("branch").value;
                let cgpa = document.getElementById("cgpa").value;
                const student = {
                    sid: parseInt(sid),
                    name: name,
                    branch: branch,
                    cgpa: parseFloat(cgpa)
                };
                let response = await fetch("http://localhost:3000/students", {
                    method: "POST",
                    headers: {
                    "Content-Type": "application/json"
                    },
                    body: JSON.stringify(student)
                });
                const students=await response.json();
                alert("Student Added");
                window.location.href = "viewstudent.html";
            }
        </script>
</head>

<body class="text-center">
    <h1> Add Student </h1>
    <form action="viewstudent.html" onsubmit="add(event)">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Student ID:</label>
            <input type="number" id="sid" class="form-control" required aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Student Name:</label>
            <input type="text" id="name" class="form-control" required aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Branch:</label>
            <input type="text" id="branch" class="form-control" required aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">CGPA :</label>
            <input type="number" id="cgpa" class="form-control" required aria-describedby="emailHelp">
        </div>
        <button type="submit" class="btn btn-outline-success">Submit</button </form><br>
    </form>
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to log out?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <a href="logout.html" class="btn btn-danger">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
