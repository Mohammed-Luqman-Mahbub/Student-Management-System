<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Student</title>
    <div style="display: flex; align-items: center; justify-content: center;" >
        <img src="https://icons.veryicon.com/png/o/system/background-management-system-4/student-management-8.png" style="width: 100px;" height="100 px">
        <h1 class="text-uppercase" style="background: #ffffff;color: #771515;">Student Management System</h1>
    </div>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <nav class="navbar" style="background-color: #500d0d;" data-bs-theme="light">
        <a href="Dashboard.html"
            class="link-warning link-offset-2 link-underline-opacity-25 bg-success-hover">Dashboard</a>
        <a href="viewstudent.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">view
            Student</a>
        <a href="addstudent.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Add
            student</a>
        <a href="contact.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Contact Us</a>
        <a href="#" class="link-danger link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover"
            data-bs-toggle="modal" data-bs-target="#logoutModal">Log Out</a>
    </nav>
    <script>
        function loadStudents() {
            const tableBody = document.getElementById("tbody");
            const students = JSON.parse(localStorage.getItem("students")) || [];
            tableBody.innerHTML = "";
            if (students.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="text-muted py-3">No students found. Add a student first!</td></tr>`;
                return;
            }
            students.forEach((student, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${student.id}</td>
                    <td><a href="Student.html?id=${student.id}" style="color: black; text-decoration: none;">${student.name}</a></td>
                    <td>${student.branch}</td>
                    <td>${student.cgpa}</td>
                    <td>
                        <a href="edit.html?id=${student.id}" class="btn btn-warning btn-sm">Edit</a>
                    </td>
                    <td>
                        <button onclick="deleteStudent(${index})" class="btn btn-danger btn-sm">Remove</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }
        function deleteStudent(index) {
            if (confirm("Are you sure you want to remove this student?")) {
                let students = JSON.parse(localStorage.getItem("students")) || [];
                students.splice(index, 1);
                localStorage.setItem("students", JSON.stringify(students));
                loadStudents();
            }
        }
        document.addEventListener("DOMContentLoaded", loadStudents);
    </script>
</head>

<body class="text-center">
    <div class="container mt-5">
        <h1 class="text-center mb-4">Students</h1>

        <div class="table-responsive">
            <table class="table table-bordered table-striped table-hover text-center">
                <thead class="table-dark">
                    <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Branch</th>
                        <th>CGPA</th>
                        <th colspan="2">Actions</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                </tbody>
            </table>
        </div>
    </div>
    <div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="logoutModalLabel">Confirm Logout</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <div class="modal-body">
                    Are you sure you want to log out?
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <a href="logout.html" class="btn btn-danger">
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
