<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <div style="display: flex; align-items: center; justify-content: center;" >
        <img src="https://icons.veryicon.com/png/o/system/background-management-system-4/student-management-8.png" style="width: 100px;" height="100 px">
        <h1 class="text-uppercase" style="background: #ffffff;color: #771515;">Student Management System</h1>
    </div>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <nav class="navbar" style="background-color: #500d0d;" data-bs-theme="light">
        <a href="index.html" class="link-warning link-offset-2 link-underline-opacity-25 bg-success-hover">Home </a>
        <a href="login.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Login </a>
        <a href="register.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Register</a>
        <a href="contact.html"
            class="link-warning link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Contact Us</a>
    </nav>
    <script>
            function validatelogin(event) {
                event.preventDefault(); 
                let emailElement = document.getElementById("email");
                let passElement = document.getElementById("pass");
                const storedUserRaw = localStorage.getItem('registeredUser');
                if (!storedUserRaw) {
                    alert("Login failed, no registered user found. Try registering first.");
                    return;
                }
                const registeredUser = JSON.parse(storedUserRaw);
                if (emailElement.value === registeredUser.email && passElement.value === registeredUser.password) {
                    alert("Login success!");
                    window.location.href = "Dashboard.html";
                } else {
                    alert("Login failed, try to register once.");
                }
            }
    </script>
</head>

<body>
    <h1 class="text-center">Login</h1>
    <form action="Dashboard.html" onsubmit="validatelogin(event)">
        <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" required aria-describedby="emailHelp">
        </div>
        <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Password</label>
            <input type="password" id="pass" class="form-control" required>
        </div>
        <div class="mb-3 form-check">
        </div>
        <button type="submit" class="btn btn-outline-success">Submit</button>
    </form>
</body>

</html>
