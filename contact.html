<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script>
        function validate(){
            event.preventDefault();
            let name=document.getElementById("contactName");
            let email=document.getElementById("contactEmail");
            let subject=document.getElementById("contactSubject");
            let message=document.getElementById("contactMessage");
            const cont={
                name:name.value,
                email:email.value,
                subject:subject.value,
                message:message.value
            };
            localStorage.setItem('ContactedUs', JSON.stringify(cont));
            alert("Your Message is recieved !");
        }
    </script>
</head>
<body class="text-center">
    <div style="display: flex; align-items: center; justify-content: center; margin-top: 20px;">
        <img src="https://icons.veryicon.com/png/o/system/background-management-system-4/student-management-8.png" style="width: 100px;" height="100 px" alt="College logo">
        <h1 class="text-uppercase" style="background: #ffffff;color: #771515; margin-left: 15px;">Student Management System</h1>
    </div>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title mb-4">Contact Us</h2>
                        <form onsubmit="validate()">
                            <div class="mb-3 text-start">
                                <label for="contactName" class="form-label">Name</label>
                                <input type="text" class="form-control" id="contactName" placeholder="Your full name" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label for="contactEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="contactEmail" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label for="contactSubject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="contactSubject" placeholder="Subject" required>
                            </div>
                            <div class="mb-3 text-start">
                                <label for="contactMessage" class="form-label">Message</label>
                                <textarea class="form-control" id="contactMessage" rows="5" placeholder="Write your message here" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-outline-primary">Send Message</button>
                            <button class="btn btn-outline-danger" onclick="history.back()">Cancel</button>
                            <!-- <button class="btn btn-outline-danger"><a href="index.html" class="text-danger" style="text-decoration: none;">Cancel</a></button> -->
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
